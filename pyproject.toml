# Tool configuration only. Dependencies live in requirements.txt.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["venv", "models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put the repo root on sys.path so `import healthscan` works. Without this,
# plain `pytest` fails while `python -m pytest` succeeds, because only the
# second one adds the current directory automatically.
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
