# Tool configuration only. Dependencies live in requirements.txt.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["venv", "models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
