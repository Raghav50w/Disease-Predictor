name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, train, and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Build datasets
        run: python -m healthscan.ml.preprocess

      # Doubles as a smoke test: if the training pipeline breaks, CI fails
      # here rather than silently shipping stale artifacts.
      - name: Train models
        run: python -m healthscan.ml.train

      - name: Test
        run: pytest --cov=healthscan --cov-report=term-missing

      # README.md and RESULTS.md are generated from models/metrics.json.
      # Fail if they no longer match what training just produced.
      - name: Check published metrics are current
        run: python scripts/update_metrics_docs.py --check

  docker:
    name: Build image
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: healthscan:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name healthscan -p 5000:5000 healthscan:${{ github.sha }}
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:5000/healthz > /tmp/health.json; then
              break
            fi
            sleep 2
          done
          cat /tmp/health.json
          # Fail if the container came up without any models baked in.
          grep -q '"ready":true' /tmp/health.json
          docker rm -f healthscan

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [quality, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ vars.RENDER_SERVICE_URL }}

    steps:
      # render.yaml sets autoDeploy: false, so deploys only ever happen here,
      # after lint, tests, and the image smoke test have all passed.
      - name: Trigger deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL is not set; skipping deploy."
            exit 0
          fi
          curl -fsS "$DEPLOY_HOOK" && echo "Deploy triggered."
