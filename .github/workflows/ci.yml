name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, train, and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Build datasets
        run: python -m healthscan.ml.preprocess

      # Doubles as a smoke test: if training breaks, CI fails here rather than
      # shipping stale artifacts.
      - name: Train models
        run: python -m healthscan.ml.train

      - name: Test
        run: pytest

  docker:
    name: Build image
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: healthscan:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name healthscan -p 5000:5000 healthscan:${{ github.sha }}
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:5000/healthz > /tmp/health.json; then
              break
            fi
            sleep 2
          done
          cat /tmp/health.json
          grep -q '"ready":true' /tmp/health.json
          docker rm -f healthscan
