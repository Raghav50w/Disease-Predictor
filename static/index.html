<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthScanner &mdash; Multi-Disease Risk Assessment</title>
    <meta name="description" content="Multi-disease risk assessment for diabetes, heart disease, and breast cancer. A student project, not a medical tool.">
    <link rel="stylesheet" href="/static/css/styles.css">
  </head>

  <body>
    <main class="shell">
      <header class="masthead">
        <h1>HealthScanner</h1>
        <p class="tagline">Multi-disease risk assessment with scikit-learn</p>
      </header>

      <div class="card">
        <form id="assessment-form" novalidate>
          <div class="selectors">
            <div class="field">
              <label for="disease-select">Condition</label>
              <select id="disease-select" name="disease"></select>
            </div>

            <div class="field">
              <label for="model-select">Model</label>
              <select id="model-select" name="model_type"></select>
            </div>
          </div>

          <hr class="divider">

          <fieldset class="measurements">
            <legend>Measurements</legend>
            <div class="grid" id="dynamic-fields"></div>
          </fieldset>

          <button type="submit" id="submit-btn">
            <span class="btn-label">Analyse risk</span>
            <span class="spinner" aria-hidden="true"></span>
          </button>
        </form>

        <div id="result" class="result" role="status" aria-live="polite" hidden></div>
      </div>

      <footer class="colophon">
        <p class="disclaimer">
          This is a student learning project, not a professional medical tool.
          It should not be used for diagnosis or treatment choices.
        </p>
        <p class="links">
          <a href="/api/diseases">API</a>
          <span aria-hidden="true">&middot;</span>
          <a href="/api/metrics">Metrics</a>
          <span aria-hidden="true">&middot;</span>
          <a href="/healthz">Health</a>
        </p>
      </footer>
    </main>

    <script src="/static/js/app.js"></script>
  </body>
</html>
